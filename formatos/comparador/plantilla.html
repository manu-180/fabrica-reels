<!doctype html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>comparador</title>
<script src="assets/vendor/gsap.min.js"></script>
<script src="assets/datos.js"></script>
<script src="assets/comun/subtitulos.js"></script>
<script src="assets/comun/cinetica.js"></script>
<style>
{{css}}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--fondo); }
#root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--fondo); font-family: var(--f-cuerpo); color: var(--tinta); }
.estacion { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
.bloque { position: absolute; left: 90px; width: 900px; }
.titular { font-family: var(--f-titulo); font-weight: var(--p-titulo); line-height: 1.02; letter-spacing: calc(var(--tracking-titulo) * 1.33); color: var(--tinta); text-wrap: balance; }
.cuerpo { font-family: var(--f-cuerpo); font-weight: 600; line-height: 1.2; letter-spacing: -0.01em; color: var(--tinta); text-wrap: balance; }
.leer .wi { opacity: 0.28; }
.col { position: absolute; top: 0; width: 450px; height: 1920px; }
.cab { position: absolute; left: 0; top: 296px; width: 450px; font-size: 92px; }
.celda { position: absolute; left: 0; width: 450px; display: flex; gap: 18px; align-items: flex-start; }
.celda svg { flex: none; width: 46px; height: 46px; margin-top: 4px; }
.celda .cuerpo { width: 386px; }
.divisor { position: absolute; left: 538px; top: 290px; width: 4px; height: 830px; border-radius: 2px; background: var(--linea-fuerte); transform-origin: 50% 0%; }
.vs { position: absolute; width: 104px; height: 104px; border-radius: 50%; background: var(--superficie); box-shadow: 0 0 0 2px var(--linea-fuerte), 0 18px 40px var(--sombra-1);
  display: flex; align-items: center; justify-content: center; font-family: var(--f-mono); font-weight: var(--p-mono); font-size: 40px; letter-spacing: 0.02em; color: var(--tinta); }
.check path { fill: none; stroke: var(--sobre-acento); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
.check circle { fill: var(--acento); }
.cruz circle { fill: none; stroke: var(--linea-fuerte); stroke-width: 3; }
.cruz path { fill: none; stroke: var(--tenue); stroke-width: 4.5; stroke-linecap: round; }
.banda { position: absolute; left: 70px; width: 940px; border-radius: calc(var(--radio) + 12px); padding: 10px; background: var(--linea); box-shadow: 0 30px 70px var(--sombra-1), 0 6px 18px var(--sombra-2); }
.banda .nucleo { position: relative; height: 100%; border-radius: calc(var(--radio) + 2px); background: var(--superficie); padding: 40px 48px; box-shadow: inset 0 1px 0 var(--luz); }
.banda .rotulo { margin-bottom: 22px; }
.banda svg { position: absolute; right: 40px; top: 34px; width: 64px; height: 64px; }
.veredicto { position: absolute; left: 90px; width: 900px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="{{duracion}}">
  {{fondo}}
  <div id="camara" data-layout-allow-overflow>
    {{profundo}}
    <div id="riel" data-layout-allow-overflow>
      {{hoja}}
      <div id="escenas" data-layout-allow-overflow data-layout-allow-overlap></div>
    </div>
  </div>
  {{luces}}
  <div id="subs"></div>
  {{audio}}
</div>
<script>
Subtitulos.fuentes().then(function () {
  var R = window.REEL;
  var L = R.layout;
  var W = 1080, H = 1920;
  gsap.defaults({ lazy: false });
  var tl = gsap.timeline({ paused: true });
  var cam = document.getElementById("camara");
  var riel = document.getElementById("riel");
  var profundo = document.getElementById("profundo");
  var escenas = document.getElementById("escenas");
  var NS = "http://www.w3.org/2000/svg";
  var GANA = R.ganador;

  function estado(el, v) { tl.fromTo(el, v, Object.assign({}, v, { duration: 0.001, ease: "none" }), 0); }
  function nuevo(tag, cls, padre) { var e = document.createElement(tag); if (cls) e.className = cls; padre.appendChild(e); return e; }
  function rotulo(padre, t) { var r = nuevo("div", "rotulo", padre); r.innerHTML = "<i></i>"; r.appendChild(document.createTextNode(t)); return r; }
  function icono(padre, bien) {
    var s = document.createElementNS(NS, "svg"); s.setAttribute("viewBox", "0 0 52 52"); s.setAttribute("class", bien ? "check" : "cruz"); padre.appendChild(s);
    var c = document.createElementNS(NS, "circle"); c.setAttribute("cx", "26"); c.setAttribute("cy", "26"); c.setAttribute("r", bien ? "26" : "24"); s.appendChild(c);
    var p = document.createElementNS(NS, "path"); p.setAttribute("d", bien ? "M15 27 L23 34 L37 19" : "M18 18 L34 34 M34 18 L18 34"); s.appendChild(p);
    return { svg: s, circulo: c, trazo: p, bien: bien };
  }
  function dibujar(ic, t) {
    tl.fromTo(ic.circulo, { scale: 0.4, transformOrigin: "50% 50%", opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(1.7)" }, t);
    tl.fromTo(ic.trazo, { strokeDasharray: 50, strokeDashoffset: 50 }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, t + 0.08);
  }
  function encender(wis, luces, desde) {
    wis.forEach(function (w, k) {
      var t = luces ? luces[k] : desde + k * 0.1;
      tl.to(w, { opacity: 1, duration: 0.16, ease: "power1.out" }, Math.max(desde + 0.2 + k * 0.02, t - 1 / 30));
    });
  }
  function resaltar(wi, t) {
    var w = wi.parentElement;
    w.style.backgroundImage = "linear-gradient(" + R.resalte.fondo + "," + R.resalte.fondo + ")";
    w.style.backgroundRepeat = "no-repeat"; w.style.backgroundPosition = "0% 55%"; w.style.borderRadius = "16px";
    w.style.paddingLeft = "0.1em"; w.style.paddingRight = "0.1em";
    tl.fromTo(w, { backgroundSize: "0% 76%" }, { backgroundSize: "100% 76%", duration: 0.5, ease: "power3.out" }, t);
    tl.set(wi, { color: R.resalte.tinta }, t + 0.12);
  }
  function veredicto(padre, arriba, max, lineas) {
    var v = nuevo("div", "titular veredicto leer", padre);
    var wv = Cinetica.trocear(v, R.veredicto.texto);
    Cinetica.ajustar(v, { max: max, min: 56, lineas: lineas || 3, ancho: 900 });
    v.style.top = arriba + "px";
    estado(wv, { opacity: 0 });
    Cinetica.subir(tl, wv, R.veredicto.t + 0.3, { stagger: 0.045, opacidad: 0.28 });
    encender(wv, R.veredicto.luces, R.veredicto.t + 0.3);
    resaltar(wv[wv.length - 1], R.veredicto.t + 0.4 + Math.max(0.5, R.veredicto.luces ? R.veredicto.luces[wv.length - 1] - R.veredicto.t : 0.9));
    return v;
  }

  // ---- Portada ----
  var portada = nuevo("div", "estacion", escenas);
  var g = nuevo("div", "bloque", portada);
  Cinetica.gancho(tl, g, { palabras: R.hook.palabras, max: 172, min: 96, lineas: 4, ancho: 900, alto: 760, resalte: R.resalte, tinta: R.tinta, resaltar: R.hook.resaltar });
  g.style.top = (760 - g.offsetHeight / 2) + "px";
  tl.fromTo(cam, { scale: 1.05 }, { scale: 1, duration: Math.max(1.2, R.hook.fin), ease: "power2.out" }, 0);
  tl.to(riel, { y: -H, duration: 0.8, ease: "power3.inOut" }, R.entra);
  tl.to(profundo, { y: -H * 0.45, duration: 0.8, ease: "power3.inOut" }, R.entra);

  if (L === "columnas") {
    var e = nuevo("div", "estacion", escenas); e.style.top = H + "px";
    var cols = { a: nuevo("div", "col", e), b: nuevo("div", "col", e) };
    cols.a.style.left = "70px"; cols.b.style.left = "560px";
    var div = nuevo("div", "divisor", e);
    var vs = nuevo("div", "vs", e); vs.textContent = R.t.contra; vs.style.left = "488px"; vs.style.top = "1068px";
    ["a", "b"].forEach(function (lado) {
      var cab = nuevo("div", "titular cab", cols[lado]);
      Cinetica.trocear(cab, R[lado], { cifras: false });
      Cinetica.ajustar(cab, { max: 96, min: 52, lineas: 2, ancho: 420 });
      tl.fromTo(cab, { opacity: 0, x: lado === "a" ? -40 : 40 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, R.entra + 0.4);
    });
    tl.fromTo(div, { scaleY: 0 }, { scaleY: 1, duration: 0.7, ease: "power3.inOut" }, R.entra + 0.35);
    tl.fromTo(vs, { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.7)" }, R.entra + 0.55);
    var perdedoras = [];
    R.filas.forEach(function (f, k) {
      ["a", "b"].forEach(function (lado) {
        var c = nuevo("div", "celda", cols[lado]);
        c.style.top = (530 + k * 200) + "px";
        var ic = icono(c, lado === GANA);
        var tx = nuevo("div", "cuerpo leer", c);
        var ws = Cinetica.trocear(tx, f[lado].texto, { cifras: false });
        Cinetica.ajustar(tx, { max: 62, min: 40, lineas: 3, ancho: 386 });
        estado(c, { opacity: 0 });
        tl.fromTo(c, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, f[lado].t);
        encender(ws, f[lado].luces, f[lado].t);
        estado(ic.svg, { opacity: 0 });
        tl.set(ic.svg, { opacity: 1 }, f.marca);
        dibujar(ic, f.marca);
        if (lado !== GANA) { tl.to(tx, { opacity: 0.5, duration: 0.3, ease: "power2.out" }, f.marca + 0.1); perdedoras.push(c); }
      });
    });
    // Se resuelve: la columna que pierde se va hacia afuera y la que gana toma el centro.
    var T = R.veredicto.t;
    var pierde = GANA === "a" ? "b" : "a";
    tl.to(cols[pierde], { x: pierde === "a" ? -160 : 160, opacity: 0, duration: 0.6, ease: "power3.in" }, T);
    tl.to([div, vs], { opacity: 0, duration: 0.3, ease: "power2.in" }, T);
    tl.to(cols[GANA], { x: GANA === "a" ? 245 : -245, scale: 0.8, transformOrigin: "50% 290px", duration: 0.8, ease: "power3.inOut" }, T + 0.15);
    veredicto(e, 990, 84, 2);
  }

  if (L === "rondas") {
    // Una ronda por punto: A arriba, B abajo, y la cámara baja una pantalla por ronda.
    R.filas.forEach(function (f, k) {
      var e = nuevo("div", "estacion", escenas); e.style.top = ((k + 1) * H) + "px";
      if (k > 0) {
        tl.to(riel, { y: -(k + 1) * H, duration: 0.8, ease: "power3.inOut" }, f.entra);
        tl.to(profundo, { y: -(k + 1) * H * 0.45, duration: 0.8, ease: "power3.inOut" }, f.entra);
      }
      var bandas = {};
      ["a", "b"].forEach(function (lado, i) {
        var b = nuevo("div", "banda", e);
        b.style.top = (i === 0 ? 290 : 770) + "px"; b.style.height = "400px";
        var n = nuevo("div", "nucleo", b);
        rotulo(n, R[lado]);
        var tx = nuevo("div", "titular leer", n); tx.style.width = "760px";
        var ws = Cinetica.trocear(tx, f[lado].texto, { cifras: false });
        Cinetica.ajustar(tx, { max: 96, min: 54, lineas: 2, ancho: 760 });
        var ic = icono(n, lado === GANA);
        bandas[lado] = { b: b, tx: tx, ic: ic };
        var t0 = k === 0 ? R.entra + 0.4 + i * 0.1 : f.entra + 0.35 + i * 0.1;
        tl.fromTo(b, { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, t0);
        encender(ws, f[lado].luces, f[lado].t);
        estado(ic.svg, { opacity: 0 });
        tl.set(ic.svg, { opacity: 1 }, f.marca);
        dibujar(ic, f.marca);
        if (lado !== GANA) tl.to(b, { opacity: 0.45, scale: 0.97, duration: 0.4, ease: "power2.out" }, f.marca + 0.1);
        else tl.fromTo(b, { scale: 1 }, { scale: 1.02, duration: 0.4, ease: "power2.out" }, f.marca + 0.1);
      });
      var vs = nuevo("div", "vs", e); vs.textContent = R.t.contra; vs.style.left = "488px"; vs.style.top = "678px";
      tl.fromTo(vs, { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.7)" }, (k === 0 ? R.entra : f.entra) + 0.55);
    });
    // El veredicto: la etiqueta que gana, enorme, y la frase.
    var fin = nuevo("div", "estacion", escenas); fin.style.top = (4 * H) + "px";
    var T2 = R.veredicto.t;
    tl.to(riel, { y: -4 * H, duration: 0.8, ease: "power3.inOut" }, T2 - 0.1);
    tl.to(profundo, { y: -4 * H * 0.45, duration: 0.8, ease: "power3.inOut" }, T2 - 0.1);
    var rg = rotulo(fin, R.t.gana); rg.style.position = "absolute"; rg.style.left = "90px"; rg.style.top = "300px";
    var et = nuevo("div", "titular bloque", fin); et.style.top = "380px";
    var we = Cinetica.trocear(et, R[GANA], { cifras: false });
    Cinetica.ajustar(et, { max: 190, min: 100, lineas: 2, ancho: 900 });
    et.style.color = "var(--acento-texto)";
    Cinetica.subir(tl, we, T2 + 0.25, { stagger: 0.05 });
    veredicto(fin, 380 + et.offsetHeight + 60, 92);
  }

  Subtitulos.montar(tl, { contenedor: document.getElementById("subs"), grupos: R.grupos, tono: R.tono, resalte: R.resalte, tinta: R.tinta });
  tl.set({}, {}, R.duracion);
  window.__timelines["main"] = tl;
});
</script>
</body>
</html>
