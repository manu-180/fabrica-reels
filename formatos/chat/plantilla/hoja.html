<!doctype html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>chat</title>
<script src="assets/vendor/gsap.min.js"></script>
<script src="assets/datos.js"></script>
<script src="assets/comun/cinetica.js"></script>
<style>
{{css}}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--fondo); }
#root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--fondo); font-family: var(--f-cuerpo); color: var(--tinta); }
#fondo-hoja { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; z-index: 1; }
#titulo { position: absolute; left: 90px; width: 900px; z-index: 3; }
#cabecera { position: absolute; left: 90px; top: 270px; width: 900px; height: 120px; z-index: 3; display: flex; align-items: center; gap: 28px; }
#avatar { width: 112px; height: 112px; border-radius: 50%; background: var(--avatar); display: flex; align-items: center; justify-content: center; font-family: var(--f-titulo); font-weight: var(--p-titulo); font-size: 52px; color: var(--tinta); flex: none; }
#quien { position: relative; height: 112px; flex: 1; }
#nombre { position: absolute; left: 0; top: 4px; font-family: var(--f-titulo); font-weight: var(--p-titulo); font-size: 60px; letter-spacing: var(--tracking-titulo); line-height: 1.1; white-space: nowrap; }
#en-linea, #escribe { position: absolute; left: 0; top: 74px; font-family: var(--f-mono); font-weight: var(--p-mono); font-size: 28px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--tenue); white-space: nowrap; }
#escribe { color: var(--acento-texto); opacity: 0; }
#filete { position: absolute; left: 90px; top: 412px; width: 900px; height: 3px; background: var(--linea-fuerte); transform-origin: 0 50%; z-index: 3; }
#vista { position: absolute; left: 0; top: 430px; width: 1080px; height: 800px; overflow: hidden; z-index: 3;
  -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,0) 0px, black 90px); mask-image: linear-gradient(180deg, rgba(0,0,0,0) 0px, black 90px); }
#lista { position: absolute; left: 90px; top: 0; width: 900px; display: flex; flex-direction: column; }
.burbuja { position: relative; max-width: 780px; padding: 24px 36px 28px; border-radius: 46px; font-weight: 500; font-size: 54px; line-height: 1.2; letter-spacing: -0.012em; margin-top: 18px; opacity: 0; }
.burbuja.ellos { align-self: flex-start; background: var(--burbuja); color: var(--tinta); border-bottom-left-radius: 14px; box-shadow: var(--sombra-burbuja); transform-origin: 0% 100%; }
.burbuja.yo { align-self: flex-end; background: var(--acento); color: var(--acento-tinta); border-bottom-right-radius: 14px; transform-origin: 100% 100%; }
.burbuja.cambio { margin-top: 34px; }
#puntos { position: absolute; left: 0; top: 0; width: 150px; height: 92px; border-radius: 46px; border-bottom-left-radius: 14px; background: var(--burbuja); box-shadow: var(--sombra-burbuja);
  display: flex; align-items: center; justify-content: center; gap: 13px; opacity: 0; transform-origin: 0% 100%; }
#puntos i { display: block; width: 18px; height: 18px; border-radius: 50%; background: var(--tenue); opacity: 0.4; }
#remate { position: absolute; z-index: 4; left: 90px; top: 300px; width: 900px; pointer-events: none; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="{{duracion}}">
  {{fondo}}
  <div id="fondo-hoja" data-layout-allow-overflow>{{profundo}}<div id="riel" data-layout-allow-overflow>{{hoja}}</div></div>
  <div id="titulo"></div>
  <div id="cabecera"><div id="avatar"><span id="inicial"></span></div><div id="quien" data-layout-allow-overlap><b id="nombre"></b><span id="en-linea" data-layout-allow-overlap>{{t:chat.en_linea}}</span><span id="escribe" data-layout-allow-overlap>{{t:chat.escribiendo_corto}}</span></div></div>
  <div id="filete"></div>
  <div id="vista"><div id="lista" data-layout-ignore><div id="puntos"><i></i><i></i><i></i></div></div></div>
  <div id="remate"></div>
  {{luces}}
  {{audio}}
</div>
<script>
(function () {
  const D = window.REEL;
  const C = D.colores;
  const raiz = document.documentElement.style;
  const vars = {
    "acento-tinta": C.acento_tinta, burbuja: C.burbuja, avatar: C.avatar, "acento-texto": C.acento_texto || C.acento,
    "sombra-burbuja": C.oscuro ? "0 18px 40px rgba(0,0,0,0.32), 0 2px 6px rgba(0,0,0,0.2)" : "0 18px 40px rgba(20,16,12,0.1), 0 2px 6px rgba(20,16,12,0.08)",
  };
  for (const k in vars) raiz.setProperty("--" + k, vars[k]);
  gsap.defaults({ lazy: false });
  const tl = gsap.timeline({ paused: true });
  const VISTA = 800, AIRE = 30, PUNTOS = 92;

  function construir() {
    const titulo = document.getElementById("titulo");
    Cinetica.gancho(tl, titulo, { palabras: D.hook.split(/\s+/).map(function (t) { return { texto: t, inicio: 0, fin: 0 }; }), max: 156, min: 96, lineas: 4, ancho: 900, alto: 700, resalte: D.resalte, tinta: D.tinta, resaltar: false });
    titulo.style.top = (760 - titulo.offsetHeight / 2) + "px";
    document.getElementById("nombre").textContent = D.contacto;
    document.getElementById("inicial").textContent = D.contacto.trim().charAt(0).toUpperCase();

    const lista = document.getElementById("lista");
    const puntos = document.getElementById("puntos");
    const burbujas = D.mensajes.map(function (m, i) {
      const b = document.createElement("div");
      b.className = "burbuja " + m.de + (i > 0 && D.mensajes[i - 1].de !== m.de ? " cambio" : "");
      b.textContent = m.texto;
      lista.appendChild(b);
      return b;
    });
    const cajas = burbujas.map(function (b) { return { top: b.offsetTop, alto: b.offsetHeight }; });
    const pie = function (k) { return k < 0 ? 0 : cajas[k].top + cajas[k].alto; };
    const ir = function (y) { return VISTA - AIRE - y; };
    const scroll = function (y, t, dur) { tl.to(lista, { y: ir(y), duration: dur || 0.5, ease: "power3.out" }, t); };

    // Portada: el gancho solo, enorme. Cuando arranca la charla sube y entra la cabecera del chat.
    const s = D.sube;
    tl.fromTo(titulo, { scale: 1.04, transformOrigin: "0% 50%" }, { scale: 1, duration: Math.max(1, s), ease: "power2.out" }, 0);
    tl.to(titulo, { y: -700, opacity: 0, duration: 0.7, ease: "power3.in" }, s - 0.25);
    tl.to("#riel", { y: -600, duration: 0.9, ease: "power3.inOut" }, s - 0.25);
    tl.to("#profundo", { y: -270, duration: 0.9, ease: "power3.inOut" }, s - 0.25);
    tl.fromTo("#cabecera", { y: 160, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power4.out" }, s + 0.1);
    tl.fromTo("#filete", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, s + 0.2);

    function ondas(desde, hasta) {
      const dots = puntos.querySelectorAll("i");
      for (let c = desde; c < hasta - 0.2; c += 0.9) {
        dots.forEach(function (d, k) {
          const t = c + k * 0.15;
          if (t + 0.44 > hasta) return;
          tl.fromTo(d, { opacity: 0.4, y: 0 }, { opacity: 1, y: -8, duration: 0.22, ease: "sine.out" }, t);
          tl.to(d, { opacity: 0.4, y: 0, duration: 0.22, ease: "sine.in" }, t + 0.22);
        });
      }
    }
    function mostrarPuntos(top, t) {
      tl.set(puntos, { y: top }, t);
      tl.fromTo(puntos, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.7)" }, t);
    }
    function escribe(t, si) {
      tl.to("#en-linea", { opacity: si ? 0 : 1, duration: 0.14, ease: "power1.out" }, t);
      tl.to("#escribe", { opacity: si ? 1 : 0, duration: 0.14, ease: "power1.out" }, t);
    }

    D.mensajes.forEach(function (m, i) {
      const b = burbujas[i];
      const caja = cajas[i];
      const t0 = Math.max(m.desde, s + 0.25);
      if (m.de === "ellos") {
        const arranca = Math.max(m.duda ? m.duda.aparece : m.escribe, s + 0.25);
        mostrarPuntos(caja.top, arranca); scroll(caja.top + PUNTOS, arranca); escribe(arranca, true);
        if (m.duda) {
          ondas(m.duda.aparece, m.duda.calla);
          tl.to(puntos, { opacity: 0, scale: 0.7, duration: 0.18, ease: "power2.in" }, m.duda.calla);
          escribe(m.duda.calla, false);
          mostrarPuntos(caja.top, m.duda.vuelve);
          escribe(m.duda.vuelve, true);
        }
        ondas(Math.max(m.escribe, arranca), m.llega);
        tl.to(puntos, { opacity: 0, scale: 0.85, duration: 0.1, ease: "power1.in" }, m.llega);
        tl.fromTo(b, { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, m.llega);
        tl.fromTo(b, { scale: 0.55 }, { scale: 1, duration: 0.44, ease: "back.out(1.5)" }, m.llega);
        scroll(pie(i), m.llega);
        escribe(m.llega, false);
      } else {
        const llega = Math.max(m.llega, t0 + 0.2);
        tl.fromTo(b, { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, llega);
        tl.fromTo(b, { y: 220, scale: 0.92 }, { y: 0, scale: 1, duration: 0.5, ease: "power4.out" }, llega);
        scroll(pie(i), llega);
      }
    });

    if (D.remate) {
      const R = D.remate;
      const caja = document.getElementById("remate");
      const r = Cinetica.remate(tl, caja, R.texto, R.golpe, { ancho: 900, num: 620 });
      caja.style.top = Math.max(280, 720 - r.alto / 2) + "px";
      tl.to(["#vista", "#cabecera", "#filete"], { scale: 0.86, opacity: 0.05, filter: "blur(16px)", duration: 0.7, ease: "power3.inOut", transformOrigin: "50% 40%" }, R.t);
    }

    const estado = function (el, v) { tl.fromTo(el, v, Object.assign({}, v, { duration: 0.001, ease: "none" }), 0); };
    estado(lista, { y: ir(0) });
    estado(puntos, { opacity: 0 });
    estado("#cabecera", { opacity: 0 });
    estado("#en-linea", { opacity: 1 });
    estado("#escribe", { opacity: 0 });
    tl.set({}, {}, D.duracion);
    window.__timelines["main"] = tl;
  }

  Promise.all((D.fuentes || []).map(function (f) { return document.fonts.load(f); })).then(function () { return document.fonts.ready; }).then(construir, construir);
})();
</script>
</body>
</html>
