<!doctype html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>antes y después, app</title>
<script src="assets/vendor/gsap.min.js"></script>
<script src="assets/datos.js"></script>
<script src="assets/comun/subtitulos.js"></script>
<script src="assets/comun/cinetica.js"></script>
<style>
{{css}}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--fondo); }
#root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--fondo); font-family: var(--f-cuerpo); color: var(--tinta); }
#escena { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; z-index: 3; }
/* La viñeta y el grano van debajo: sobre las capturas reales las apagaban. */
#luces { z-index: 2; }
#caos { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
.doc { position: absolute; overflow: hidden; box-shadow: 0 30px 60px rgba(0,0,0,0.30), 0 6px 14px rgba(0,0,0,0.18); }
.cinta { position: absolute; width: 150px; height: 44px; background: rgba(255,255,255,0.55); box-shadow: 0 2px 6px rgba(0,0,0,0.12); }
.mano { font-family: var(--f-cuerpo); font-style: italic; font-weight: 600; }

/* La planilla impresa pegada en la pared, escrita y tachada a mano. */
#planilla { left: 80px; top: 330px; width: 620px; height: 660px; background: #f4efe2; transform: rotate(-3deg); padding: 34px 34px 0; color: #2b2b2b; }
#planilla h3 { font-family: var(--f-cuerpo); font-weight: 600; font-size: 36px; letter-spacing: -0.01em; color: #2b2b2b; margin-bottom: 18px; }
#planilla table { width: 100%; border-collapse: collapse; }
#planilla th { font-family: var(--f-mono); font-weight: var(--p-mono); font-size: 22px; text-align: left; padding: 10px 12px; border: 2px solid #5f6b6d; background: #e9e4d6; color: #2b2b2b; }
#planilla td { position: relative; height: 72px; padding: 0 12px; border: 2px solid #5f6b6d; font-size: 32px; color: #1f3d9c; white-space: nowrap; }
#planilla td s { text-decoration: none; position: relative; color: #1f3d9c; }
#planilla td s::after { content: ""; position: absolute; left: -6px; right: -6px; top: 52%; height: 4px; background: #c0392b; transform: rotate(-6deg); }
#planilla td em { font-style: italic; color: #c0392b; font-size: 26px; margin-left: 10px; display: inline-block; transform: rotate(-8deg); }

/* El grupo de mensajes. */
#chat { left: 560px; top: 520px; width: 460px; height: 640px; background: #efe7dc; border-radius: 36px; transform: rotate(3deg); }
#chat .cab { height: 96px; background: #0b5c4f; display: flex; align-items: center; justify-content: space-between; padding: 0 26px; }
#chat .cab b { font-family: var(--f-cuerpo); font-weight: 600; font-size: 30px; color: #ffffff; }
#chat .cab span { min-width: 56px; height: 44px; border-radius: 22px; background: #d9fdd3; color: #0b5c4f; font-family: var(--f-mono); font-weight: var(--p-mono); font-size: 24px; display: flex; align-items: center; justify-content: center; padding: 0 12px; }
#chat .msgs { position: absolute; left: 0; right: 0; top: 96px; bottom: 56px; padding: 18px 20px; display: flex; flex-direction: column; justify-content: flex-end; gap: 12px; overflow: hidden; }
#chat .m { max-width: 82%; padding: 12px 18px; border-radius: 20px; background: #ffffff; font-size: 27px; line-height: 1.25; color: #2b2b2b; box-shadow: 0 1px 1px rgba(0,0,0,0.12); }
#chat .m i { display: block; font-style: normal; font-weight: 600; font-size: 20px; color: #c0392b; margin-bottom: 2px; }
#chat .m.yo { align-self: flex-end; background: #d9fdd3; }
#chat .m.yo i { color: #1f3d9c; }
#chat .esc { position: absolute; left: 26px; bottom: 16px; font-style: italic; font-size: 24px; color: #0b5c4f; }

/* El cuaderno de asistencia. */
#cuaderno { left: 110px; top: 850px; width: 600px; height: 350px; background-color: #fbf7ea; transform: rotate(1.5deg); padding: 24px 28px 0 96px; color: #1f3d9c;
  background-image: linear-gradient(to right, transparent 70px, #e05a4f 70px, #e05a4f 73px, transparent 73px), linear-gradient(to bottom, transparent 46px, #9fc3e6 46px, #9fc3e6 48px, transparent 48px);
  background-size: 100% 100%, 100% 48px; }
#cuaderno h4 { font-family: var(--f-cuerpo); font-weight: 600; font-size: 30px; color: #2b2b2b; height: 48px; }
#cuaderno .fila { display: flex; height: 48px; align-items: center; font-size: 26px; }
#cuaderno .fila b { width: 120px; font-weight: 600; color: #2b2b2b; }
#cuaderno .fila span { width: 78px; text-align: center; }
#cuaderno .fila span.no { color: #c0392b; }

.chip { position: absolute; left: 90px; top: 262px; display: flex; align-items: center; gap: 16px; padding: 16px 30px 16px 18px; border-radius: 999px; background: rgba(12,12,14,0.94);
  box-shadow: 0 16px 36px rgba(0,0,0,0.32); font-weight: 600; font-size: 38px; line-height: 1.1; color: #ffffff; white-space: nowrap; opacity: 0; z-index: 6; }
.chip svg { display: block; flex: 0 0 40px; width: 40px; height: 40px; }
.chip svg circle { fill: var(--acento); }
.chip svg path { stroke: var(--sobre-acento); stroke-width: 4.5; stroke-linecap: round; fill: none; }

/* Después: la app de verdad, en un celular, y lo que cambia al costado. */
#despues { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
#col { position: absolute; left: 90px; top: 330px; width: 430px; }
#col .marca { font-family: var(--f-mono); font-weight: var(--p-mono); font-size: 30px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--tenue); margin-bottom: 22px; }
#col .titular { font-family: var(--f-titulo); font-weight: var(--p-titulo); line-height: 1.02; letter-spacing: calc(var(--tracking-titulo) * 1.33); color: var(--tinta); text-wrap: balance; width: 430px; }
#col .secs { margin-top: 44px; }
#col .sec { position: relative; display: flex; align-items: center; gap: 18px; padding: 22px 0; font-family: var(--f-titulo); font-weight: 600; font-size: 40px; letter-spacing: -0.01em; color: var(--tenue); }
#col .sec .raya { position: absolute; left: 0; top: 0; width: 430px; height: 2px; background: var(--linea-fuerte); transform-origin: 0 50%; }
#col .sec i { flex: none; width: 14px; height: 14px; border-radius: 50%; background: var(--linea-fuerte); }
#tel { position: absolute; left: 556px; top: 282px; width: 468px; height: 940px; border-radius: 66px; padding: 14px; background: #0c0c0e;
  box-shadow: 0 0 0 2px rgba(255,255,255,0.08), 0 60px 110px rgba(0,0,0,0.42), 0 16px 34px rgba(0,0,0,0.26); }
#pantalla { position: relative; width: 440px; height: 912px; border-radius: 52px; overflow: hidden; background: #ffffff; }
#pantalla img { position: absolute; left: 0; top: 0; width: 440px; height: 912px; object-fit: cover; object-position: 50% 0%; }
#subs { position: absolute; inset: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="{{duracion}}">
  {{fondo}}
  <div id="camara" data-layout-allow-overflow>
    {{profundo}}
    <div id="riel" data-layout-allow-overflow>{{hoja}}</div>
  </div>
  {{luces}}
  <div id="escena" data-layout-allow-overflow data-layout-allow-overlap>
    <div id="caos" data-layout-allow-overflow data-layout-allow-overlap>
      <div class="doc" id="planilla"><h3 id="p-tit"></h3><table id="p-tabla"></table><i class="cinta" style="left: 230px; top: -14px; transform: rotate(4deg)"></i></div>
      <div class="doc" id="cuaderno"><h4 id="c-tit"></h4><div id="c-filas"></div></div>
      <div class="doc" id="chat"><div class="cab"><b id="ch-grupo"></b><span id="ch-n"></span></div><div class="msgs" id="ch-msgs"></div><div class="esc" id="ch-esc"></div></div>
    </div>
    <div id="despues">
      <div id="col"><div class="marca" id="d-marca"></div><div class="titular" id="d-titular"></div><div class="secs" id="d-secs"></div></div>
      <div id="tel"><div id="pantalla"></div></div>
    </div>
  </div>
  <div id="chips"></div>
  <div id="subs"></div>
  {{audio}}
</div>
<script>
(function () {
  var R = window.REEL;
  var T = R.t;
  gsap.defaults({ lazy: false });
  var tl = gsap.timeline({ paused: true });
  function $(id) { return document.getElementById(id); }
  function nuevo(tag, cls, padre) { var e = document.createElement(tag); if (cls) e.className = cls; padre.appendChild(e); return e; }
  function estado(el, v) { tl.fromTo(el, v, Object.assign({}, v, { duration: 0.001, ease: "none" }), 0); }

  function caos() {
    $("p-tit").textContent = T.planilla + " · " + R.negocio.nombre;
    var tabla = $("p-tabla");
    var cab = nuevo("tr", "", tabla);
    T.horas.forEach(function (h) { var th = nuevo("th", "", cab); th.textContent = h; });
    var n = T.nombres;
    for (var f = 0; f < 6; f++) {
      var tr = nuevo("tr", "", tabla);
      for (var c = 0; c < 3; c++) {
        var td = nuevo("td", "mano", tr);
        var k = (f * 3 + c * 5) % n.length;
        if ((f + c) % 4 === 1) { var s = nuevo("s", "", td); s.textContent = n[k]; var em = nuevo("em", "", td); em.textContent = n[(k + 4) % n.length]; }
        else if ((f * 2 + c) % 5 !== 3) td.textContent = n[k];
      }
    }
    $("c-tit").textContent = T.cuaderno;
    var filas = $("c-filas");
    for (var r = 0; r < 5; r++) {
      var fi = nuevo("div", "fila mano", filas);
      var b = nuevo("b", "", fi); b.textContent = n[(r * 2 + 1) % n.length];
      for (var d = 0; d < 5; d++) {
        var sp = nuevo("span", "", fi);
        var marca = (r + d * 2) % 5;
        sp.textContent = marca === 0 ? T.ausente : marca === 3 ? T.recupera : T.presente;
        if (marca !== 1 && marca !== 2 && marca !== 4) sp.className = "no";
      }
    }
    $("ch-grupo").textContent = T.grupo;
    $("ch-n").textContent = T.no_leidos;
    $("ch-esc").textContent = T.escribiendo;
    // Los mensajes no paran de entrar mientras dura el antes: el grupo vive.
    var msgs = $("ch-msgs");
    var hasta = R.cambio - 0.4;
    var paso = Math.max(0.55, (hasta - 0.6) / (T.mensajes.length + 2));
    T.mensajes.forEach(function (m, k) {
      var el = nuevo("div", "m" + (k % 3 === 2 ? " yo" : ""), msgs);
      var who = nuevo("i", "", el); who.textContent = n[(k * 5 + 2) % n.length];
      el.appendChild(document.createTextNode(m));
      if (k < 2) return;
      var t = 0.5 + (k - 2) * paso;
      estado(el, { opacity: 0, scale: 0.9 });
      tl.fromTo(el, { opacity: 0, scale: 0.9, y: 30, transformOrigin: k % 3 === 2 ? "100% 100%" : "0% 100%" }, { opacity: 1, scale: 1, y: 0, duration: 0.3, ease: "back.out(1.6)" }, t);
    });
    tl.fromTo("#caos", { scale: 1.06 }, { scale: 1, duration: 1.3, ease: "expo.out" }, 0);
  }

  // A qué documento señala cada defecto: lo dicen sus palabras; si no, el primero libre.
  var CLAVES = [["planilla", /planilla|pared|papel|hoja|turno/], ["chat", /whatsapp|mensaje|chat|grupo|aviso/], ["cuaderno", /cuaderno|asistencia|cupo|recuper|pago|lista|anot/]];
  function docDe(texto, usados) {
    var t = texto.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
    var hit = CLAVES.filter(function (c) { return usados.indexOf(c[0]) < 0 && c[1].test(t); })[0];
    if (!hit) hit = CLAVES.filter(function (c) { return usados.indexOf(c[0]) < 0; })[0] || CLAVES[0];
    usados.push(hit[0]);
    return hit[0];
  }

  function defectos() {
    var usados = [];
    var docs = ["planilla", "cuaderno", "chat"];
    R.defectos.forEach(function (d, k) {
      var id = docDe(d.texto, usados);
      var el = $(id);
      var cx = el.offsetLeft + el.offsetWidth / 2, cy = el.offsetTop + el.offsetHeight / 2;
      var s = 1.06;
      var hasta = k + 1 < R.defectos.length ? R.defectos[k + 1].t : R.cambio - 0.2;
      // La cámara va al documento que la voz nombra; los otros se apagan un poco y éste pasa adelante.
      tl.to("#caos", { x: 540 - s * cx, y: 720 - s * cy, scale: s, duration: 0.7, ease: "power3.inOut" }, d.t - 0.1);
      docs.forEach(function (o, z) {
        tl.set($(o), { zIndex: o === id ? 5 : z + 1 }, d.t);
        tl.to($(o), { opacity: o === id ? 1 : 0.55, duration: 0.35, ease: "power2.out" }, d.t);
      });
      var chip = nuevo("div", "chip", $("chips"));
      chip.innerHTML = '<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="20"/><path d="M13 13 L27 27 M27 13 L13 27"/></svg><span></span>';
      chip.querySelector("span").textContent = d.texto;
      tl.fromTo(chip, { opacity: 0, scale: 0.9, y: 18 }, { opacity: 1, scale: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" }, d.t + 0.3);
      tl.to(chip, { opacity: 0, y: -12, duration: 0.2, ease: "power2.in" }, hasta - 0.2);
    });
  }

  function despues() {
    var C = R.cambio;
    var cs = getComputedStyle(document.documentElement);
    var ACENTO = cs.getPropertyValue("--acento").trim(), TINTA = cs.getPropertyValue("--tinta").trim(), TENUE = cs.getPropertyValue("--tenue").trim();
    // El caos se va hacia arriba, de a un papel por vez; la app sube desde abajo (la corriente es hacia arriba).
    tl.to("#caos", { x: 0, scale: 1, duration: 0.7, ease: "power3.inOut" }, C - 0.15);
    ["planilla", "cuaderno", "chat"].forEach(function (id, k) {
      tl.to($(id), { y: -1600, rotation: (k % 2 ? 9 : -7), opacity: 1, duration: 0.75, ease: "power3.in" }, C + k * 0.07);
    });
    $("d-marca").textContent = R.negocio.nombre;
    var tit = $("d-titular");
    var ws = Cinetica.trocear(tit, R.despues.titular);
    Cinetica.ajustar(tit, { max: 84, min: 50, lineas: 5, ancho: 430 });
    var secs = $("d-secs");
    var filas = R.pantallas.map(function (p) {
      if (!p.seccion) return null;
      var f = nuevo("div", "sec", secs); nuevo("i", "raya", f); nuevo("i", "", f);
      var sp = nuevo("span", "", f); sp.textContent = p.seccion;
      return f;
    });
    estado("#despues", { opacity: 0 });
    tl.set("#despues", { opacity: 1 }, C + 0.3);
    tl.fromTo("#tel", { y: 900 }, { y: 0, duration: 0.95, ease: "power3.out" }, C + 0.3);
    tl.fromTo("#d-marca", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, C + 0.45);
    Cinetica.subir(tl, ws, C + 0.55, { stagger: 0.05 });
    filas.forEach(function (f, k) {
      if (!f) return;
      tl.fromTo(f.querySelector(".raya"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.inOut" }, C + 0.8 + k * 0.08);
      tl.fromTo(f, { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, C + 0.85 + k * 0.08);
    });
    // Cada pantalla real entra empujando a la anterior, como se navega en la app.
    var previa = null;
    R.pantallas.forEach(function (p, k) {
      var img = nuevo("img", "", $("pantalla")); img.src = p.src; img.alt = "";
      if (k > 0) {
        estado(img, { x: 440 });
        tl.fromTo(img, { x: 440 }, { x: 0, duration: 0.6, ease: "power3.inOut" }, p.t);
        tl.to(previa, { x: -140, opacity: 0.4, duration: 0.6, ease: "power3.inOut" }, p.t);
        tl.set(previa, { opacity: 0 }, p.t + 0.61);
      }
      var f = filas[k];
      if (f) {
        tl.to(f, { color: TINTA, duration: 0.25, ease: "power2.out" }, p.t);
        tl.to(f.querySelectorAll("i")[1], { backgroundColor: ACENTO, scale: 1.3, duration: 0.3, ease: "back.out(2)" }, p.t);
        filas.forEach(function (o, j) { if (o && j < k) tl.to(o, { color: TENUE, duration: 0.25 }, p.t); });
      }
      previa = img;
    });
  }

  function construir() {
    caos();
    defectos();
    despues();
    Subtitulos.montar(tl, { contenedor: $("subs"), grupos: R.grupos, tono: R.tono, resalte: R.resalte, tinta: R.tinta });
    tl.set({}, {}, R.duracion);
    window.__timelines["main"] = tl;
  }
  Subtitulos.fuentes().then(construir, construir);
})();
</script>
</body>
</html>
