<!doctype html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>explicador</title>
<script src="assets/vendor/gsap.min.js"></script>
<script src="assets/datos.js"></script>
<script src="assets/comun/subtitulos.js"></script>
<script src="assets/comun/cinetica.js"></script>
<style>
{{css}}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--fondo); }
#root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--fondo); font-family: var(--f-cuerpo); color: var(--tinta); }
.estacion { position: absolute; left: 0; width: 1080px; height: 1920px; }
.bloque { position: absolute; left: 90px; width: 900px; }
.titulo-t { font-family: var(--f-titulo); font-weight: var(--p-titulo); line-height: 0.98; letter-spacing: calc(var(--tracking-titulo) * 1.5); word-spacing: 0.02em; color: var(--tinta); text-wrap: balance; }
.zoom .titulo-t, .zoom .gancho { text-align: center; }
.raya { position: absolute; height: 18px; border-radius: 9px; background: var(--acento); transform-origin: 0% 50%; }
.marca { position: absolute; border-radius: 18px; transform-origin: 0% 50%; z-index: 0; }
.w.marcada { position: relative; z-index: 1; }
.heroe { position: absolute; font-family: var(--f-titulo); font-weight: var(--p-titulo); line-height: 0.8; letter-spacing: calc(var(--tracking-titulo) * 2); white-space: nowrap; color: var(--acento); font-variant-numeric: tabular-nums; }
.heroe.contorno { color: transparent; -webkit-text-stroke: 5px var(--acento); opacity: 0.55; }
.heroe-rotulo { position: absolute; }
.fila { position: absolute; left: 90px; width: 900px; text-align: right; }
.concepto { font-weight: 600; font-size: 46px; line-height: 1.15; letter-spacing: -0.01em; color: var(--tenue); }
.valor { display: inline-block; font-family: var(--f-titulo); font-weight: var(--p-titulo); line-height: 0.86; letter-spacing: calc(var(--tracking-titulo) * 1.83); font-variant-numeric: tabular-nums; color: var(--tinta); white-space: nowrap; transform-origin: 100% 60%; }
.fila.total .concepto { color: var(--tinta); font-weight: 700; }
.fila.total .valor { color: var(--acento); }
.regla { position: absolute; left: 90px; width: 900px; height: 8px; border-radius: 4px; background: var(--tinta); transform-origin: 100% 50%; }
.tira { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.termino { position: absolute; top: 0; text-align: center; }
.termino .valor { transform-origin: 50% 60%; }
.termino .concepto { margin: 34px auto 0; max-width: 560px; }
.termino.total .valor { color: var(--acento); }
.termino.total .concepto { color: var(--tinta); font-weight: 700; }
.igual { color: var(--tenue); }
.grupo { position: absolute; left: 90px; width: 900px; transform-origin: 0% 0%; }
.zoom .grupo { text-align: center; transform-origin: 50% 50%; }
.cab { font-family: var(--f-titulo); font-weight: var(--p-titulo); letter-spacing: calc(var(--tracking-titulo) * 1.33); line-height: 1; }
.grupo.pierde .cab { color: var(--tenue); }
.items { margin-top: 30px; display: flex; flex-direction: column; gap: 20px; }
.zoom .items { align-items: center; }
.item { display: flex; align-items: center; gap: 26px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.05; }
.grupo.pierde .item { color: var(--tenue); }
.grupo.gana .item { font-weight: 700; color: var(--tinta); }
.sello { flex: none; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
.grupo.pierde .sello { border: 4px solid var(--linea-fuerte); color: var(--tenue); font-weight: 500; }
.grupo.gana .sello { background: var(--acento); }
.sello svg { display: block; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="{{duracion}}">
  {{fondo}}
  <div id="camara" data-layout-allow-overflow>
    {{profundo}}
    <div id="riel" data-layout-allow-overflow>
      {{hoja}}
      <div id="escenas" data-layout-allow-overflow data-layout-allow-overlap></div>
    </div>
  </div>
  {{luces}}
  <div id="subs"></div>
  {{audio}}
</div>
<script>
Subtitulos.fuentes().then(function () {
  var R = window.REEL;
  var L = R.layout;
  var H = 1920;
  gsap.defaults({ lazy: false });
  var tl = gsap.timeline({ paused: true });
  var cam = document.getElementById("camara");
  var riel = document.getElementById("riel");
  var hoja = document.getElementById("hoja");
  var profundo = document.getElementById("profundo");
  var escenas = document.getElementById("escenas");
  escenas.className = L;
  document.documentElement.style.setProperty("--acento-texto", getComputedStyle(document.documentElement).getPropertyValue("--acento"));

  // El estado del cuadro 0 va como fromTo de 1 ms: un gsap.set en 0 se revierte cuando el seek vuelve a 0.
  function estado(el, v) { tl.fromTo(el, v, Object.assign({}, v, { duration: 0.001, ease: "none" }), 0); }
  function nuevo(tag, cls, padre) { var e = document.createElement(tag); if (cls) e.className = cls; padre.appendChild(e); return e; }
  function estacion(k) { var e = nuevo("div", "estacion", escenas); e.style.top = (L === "hoja" ? k * H : 0) + "px"; return e; }
  function caja(el) { var y = 0, x = 0, n = el; while (n && n.classList && !n.classList.contains("estacion")) { y += n.offsetTop; x += n.offsetLeft; n = n.offsetParent; } return { x: x, y: y, w: el.offsetWidth, h: el.offsetHeight }; }
  function ajustarAncho(el, max, min, ancho) { var t = max; el.style.fontSize = t + "px"; while (el.scrollWidth > ancho && t > min) { t -= 6; el.style.fontSize = t + "px"; } return t; }
  function check(padre, tam) {
    var ns = "http://www.w3.org/2000/svg";
    var s = document.createElementNS(ns, "svg");
    s.setAttribute("viewBox", "0 0 40 40"); s.setAttribute("width", tam); s.setAttribute("height", tam);
    var p = document.createElementNS(ns, "path");
    p.setAttribute("d", "M10 21 L17 28 L30 13"); p.setAttribute("fill", "none"); p.setAttribute("stroke", getComputedStyle(document.documentElement).getPropertyValue("--sobre-acento"));
    p.setAttribute("stroke-width", "5"); p.setAttribute("stroke-linecap", "round"); p.setAttribute("stroke-linejoin", "round");
    p.setAttribute("stroke-dasharray", "40"); p.setAttribute("stroke-dashoffset", "40");
    s.appendChild(p); padre.appendChild(s);
    return p;
  }

  var estaciones = [];

  // ---- El gancho: la portada, con el resultado ya en cuadro ----
  (function () {
    var e = estacion(0);
    estaciones.push(e);
    var arriba = 300;
    if (R.fuente) {
      var f = nuevo("div", "rotulo bloque", e);
      f.innerHTML = "<i></i>";
      f.appendChild(document.createTextNode(R.fuente));
      f.style.top = "292px";
      if (L === "zoom") { f.style.left = "0px"; f.style.width = "1080px"; f.style.justifyContent = "center"; }
      arriba = 384;
    }
    var g = nuevo("div", "bloque", e);
    // El piso de todo lo propio es y 1200: debajo arrancan los subtítulos.
    var PISO = 1200;
    var altoHook = R.heroe && L === "hoja" ? PISO - arriba - 60 - 380 * 0.8 - 70 : 820;
    var gh = Cinetica.gancho(tl, g, { palabras: R.hook.palabras, max: L === "zoom" ? 150 : 140, min: 96, lineas: 4, ancho: 900, alto: altoHook, resalte: R.resalte, tinta: R.tinta, resaltar: R.hook.resaltar });
    if (R.heroe) {
      var h = nuevo("div", "heroe" + (L === "zoom" ? " contorno" : ""), e);
      h.textContent = R.heroe.valor;
      if (L === "hoja") {
        g.style.top = arriba + "px";
        var libre = PISO - (arriba + g.offsetHeight) - 60 - 70;
        var tam = ajustarAncho(h, Math.min(700, Math.max(300, libre / 0.8)), 220, 840);
        h.style.right = "150px";
        h.style.top = (PISO - tam * 0.8) + "px";
        if (R.heroe.rotulo) {
          var hr = nuevo("div", "rotulo heroe-rotulo", e);
          hr.textContent = R.heroe.rotulo;
          hr.style.right = "150px";
          hr.style.top = (PISO - tam * 0.8 - 70) + "px";
        }
        estado(h, { opacity: 1 });
      } else {
        var tz = ajustarAncho(h, 1250, 400, 1060);
        h.style.left = (540 - h.offsetWidth / 2) + "px";
        h.style.top = (800 - tz * 0.4) + "px";
        g.style.top = (760 - g.offsetHeight / 2) + "px";
        tl.fromTo(h, { scale: 1.14, transformOrigin: "50% 50%" }, { scale: 1, duration: Math.max(1.2, R.hook.fin), ease: "power2.out" }, 0);
        if (R.heroe.rotulo) {
          var hz = nuevo("div", "rotulo bloque", e);
          hz.textContent = R.heroe.rotulo;
          hz.style.left = "0px"; hz.style.width = "1080px"; hz.style.justifyContent = "center";
          hz.style.top = (760 + g.offsetHeight / 2 + 40) + "px";
        }
      }
    } else {
      g.style.top = (L === "zoom" ? 900 - g.offsetHeight / 2 : Math.max(arriba, 760 - g.offsetHeight / 2)) + "px";
    }
    if (L === "hoja") tl.fromTo(cam, { scale: 1 }, { scale: 1.045, duration: Math.max(1.2, R.hook.fin), ease: "power1.inOut" }, 0);
  })();

  // ---- Los bloques ----
  function titulo(e, b) {
    var cont = nuevo("div", "bloque titulo-t", e);
    var wis = Cinetica.trocear(cont, b.visual.texto);
    var tam = Cinetica.ajustar(cont, { max: L === "zoom" ? 188 : 172, min: 96, lineas: 4, ancho: 900 });
    var alto = cont.offsetHeight;
    cont.style.top = (380 + Math.max(0, (800 - alto) / 2)) + "px";
    Cinetica.subir(tl, wis, b.entra + b.m.palabras, { stagger: 0.06 });
    if (L === "hoja") {
      var r = nuevo("div", "raya", e);
      r.style.left = "90px"; r.style.width = "280px";
      r.style.top = (parseFloat(cont.style.top) + alto + 46) + "px";
      tl.fromTo(r, { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power3.out" }, b.entra + b.m.raya);
    } else {
      var clave = cont.querySelector(".wi.num") || wis[wis.length - 1];
      var w = clave.parentElement;
      w.style.backgroundImage = "linear-gradient(" + R.resalte.fondo + "," + R.resalte.fondo + ")";
      w.style.backgroundRepeat = "no-repeat"; w.style.backgroundPosition = "0% 55%"; w.style.borderRadius = "18px";
      w.style.paddingLeft = "0.1em"; w.style.paddingRight = "0.1em"; w.style.marginLeft = "-0.06em"; w.style.marginRight = "-0.06em";
      tl.fromTo(w, { backgroundSize: "0% 74%" }, { backgroundSize: "100% 74%", duration: 0.5, ease: "power3.out" }, b.entra + b.m.raya);
      tl.set(clave, { color: R.resalte.tinta }, b.entra + b.m.raya + 0.12);
    }
  }

  function cuentaLibro(e, b) {
    var v = b.visual, n = v.filas.length;
    var caja0 = nuevo("div", "", e);
    var T0 = 430;
    var S = Math.min(300, (860 - 14 * n - 0.9 * T0) / (0.9 * n));
    var armado;
    // Fila en línea (rótulo a la izquierda, cifra a la derecha) si entra; si no, el rótulo arriba.
    function fila(padre, concepto, valor, tam, y, total) {
      var f = nuevo("div", "fila" + (total ? " total" : ""), padre);
      f.style.top = y + "px";
      var c = nuevo("div", "concepto", f);
      var wis = Cinetica.trocear(c, concepto);
      var val = nuevo("span", "valor", f);
      val.textContent = valor;
      ajustarAncho(val, tam, 90, 900);
      if (val.offsetWidth + 460 <= 900) {
        f.style.display = "flex"; f.style.justifyContent = "space-between"; f.style.alignItems = "flex-end";
        c.style.maxWidth = "430px"; c.style.textAlign = "left"; c.style.paddingBottom = Math.round(parseFloat(val.style.fontSize) * 0.1) + "px";
      }
      return { el: f, val: val, wis: wis };
    }
    for (var vuelta = 0; vuelta < 6; vuelta++) {
      caja0.innerHTML = "";
      var y = 300;
      var filas = v.filas.map(function (f) { var r = fila(caja0, f.concepto, f.valor, S, y, false); y += r.el.offsetHeight + 14; return r; });
      var yRegla = y + 10;
      var tot = fila(caja0, v.total.concepto, v.total.valor, Math.max(T0, S * 1.2), y + 44, true);
      armado = { filas: filas, yRegla: yRegla, tot: tot };
      if (y + 44 + tot.el.offsetHeight <= 1190) break;
      S *= 0.9; T0 *= 0.94;
    }
    var desplazo = Math.max(0, (1180 - (armado.tot.el.offsetTop + armado.tot.el.offsetHeight)) * 0.6);
    caja0.style.position = "absolute"; caja0.style.left = "0px"; caja0.style.top = desplazo + "px"; caja0.style.width = "1080px";
    armado.filas.forEach(function (r, i) {
      tl.fromTo(r.val, { x: 240, y: 110, scale: 1.5, opacity: 0, filter: "blur(14px)" }, { x: 0, y: 0, scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.62, ease: "power4.out" }, b.entra + b.m.filas[i] + 0.05);
      Cinetica.subir(tl, r.wis, b.entra + b.m.filas[i], { stagger: 0.03, dur: 0.5 });
    });
    var regla = nuevo("div", "regla", caja0);
    regla.style.top = armado.yRegla + "px";
    tl.fromTo(regla, { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, b.entra + b.m.raya);
    var tv = armado.tot.val;
    Cinetica.subir(tl, armado.tot.wis, b.entra + b.m.raya + 0.1, { stagger: 0.03, dur: 0.5 });
    var t = b.entra + b.m.total;
    estado(tv, { opacity: 0 });
    tl.fromTo(tv, { opacity: 0, scale: 0.55 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.5)" }, t);
    Cinetica.contar(tl, tv, v.total.valor, t, 0.62);
    var c = caja(tv);
    tl.set(cam, { transformOrigin: "540px " + Math.round(c.y + c.h / 2) + "px" }, t - 0.02);
    tl.to(cam, { scale: 1.1, duration: 0.55, ease: "expo.out" }, t + 0.04);
  }

  function cuentaTira(e, b) {
    var v = b.visual;
    var tira = nuevo("div", "tira", e);
    var V = 400, Y = 760;
    var x = 0;
    var piezas = v.filas.map(function (f) { return { valor: f.valor, concepto: f.concepto, total: false }; });
    piezas.push({ igual: true });
    piezas.push({ valor: v.total.valor, concepto: v.total.concepto, total: true });
    var els = piezas.map(function (p) {
      var t = nuevo("div", "termino" + (p.total ? " total" : ""), tira);
      var val = nuevo("span", "valor" + (p.igual ? " igual" : ""), t);
      val.textContent = p.igual ? "=" : p.valor;
      val.style.fontSize = (p.total ? V * 1.12 : p.igual ? V * 0.8 : V) + "px";
      var c = null, wis = [];
      if (!p.igual) { c = nuevo("div", "concepto", t); wis = Cinetica.trocear(c, p.concepto); }
      var w = Math.max(val.offsetWidth, c ? Math.min(560, c.scrollWidth) : 0);
      t.style.left = x + "px"; t.style.width = w + "px";
      t.style.top = (Y - val.offsetHeight / 2) + "px";
      var r = { el: t, val: val, wis: wis, x: x, w: w };
      x += w + 150;
      return r;
    });
    var ancho = x - 150;
    var centro = function (r) { return 540 - (r.x + r.w / 2); };
    estado(tira, { x: centro(els[0]), y: 0, scale: 1 });
    v.filas.forEach(function (f, i) {
      var t = b.entra + b.m.filas[i];
      if (i > 0) tl.to(tira, { x: centro(els[i]), duration: 0.6, ease: "power3.inOut" }, t - 0.12);
      tl.fromTo(els[i].val, { y: 170, opacity: 0, filter: "blur(12px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.6, ease: "power4.out" }, t + 0.06);
      Cinetica.subir(tl, els[i].wis, t + 0.18, { stagger: 0.03, dur: 0.5 });
    });
    var ig = els[els.length - 2], to = els[els.length - 1];
    var mitad = { x: ig.x, w: to.x + to.w - ig.x };
    tl.to(tira, { x: centro(mitad), duration: 0.6, ease: "power3.inOut" }, b.entra + b.m.raya - 0.1);
    tl.fromTo(ig.val, { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.6)" }, b.entra + b.m.raya + 0.1);
    var t0 = b.entra + b.m.total;
    estado(to.val, { opacity: 0 });
    tl.fromTo(to.val, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.5)" }, t0);
    Cinetica.contar(tl, to.val, v.total.valor, t0, 0.62);
    Cinetica.subir(tl, to.wis, t0 + 0.12, { stagger: 0.03, dur: 0.5 });
    var lejos = t0 + 0.75;
    if (lejos + 0.8 < b.fin - 0.05) {
      var s = Math.min(1, 900 / ancho);
      tl.to(tira, { x: 540 - s * ancho / 2, y: Y - s * Y - 40, scale: s, duration: 0.8, ease: "power3.inOut" }, lejos);
    }
  }

  function comparacion(e, b) {
    var v = b.visual;
    var z = L === "zoom";
    function grupo(lado, gana) {
      var g = nuevo("div", "grupo " + (gana ? "gana" : "pierde"), e);
      var cab = nuevo("div", "cab", g);
      cab.style.fontSize = (z ? (gana ? 170 : 150) : (gana ? 168 : 120)) + "px";
      if (gana && z) cab.style.color = "var(--acento)";
      var cw = Cinetica.trocear(cab, lado.titulo, { cifras: false });
      var its = nuevo("div", "items", g);
      var tamI = z ? (gana ? 96 : 88) : (gana ? 92 : 76);
      var filas = lado.items.map(function (txt) {
        var it = nuevo("div", "item", its);
        it.style.fontSize = tamI + "px";
        var se = nuevo("span", "sello", it);
        var d = Math.round(tamI * 0.86);
        se.style.width = d + "px"; se.style.height = d + "px";
        var trazo = null;
        if (gana) trazo = check(se, Math.round(d * 0.78));
        else { se.textContent = "×"; se.style.fontSize = Math.round(d * 0.62) + "px"; }
        var tx = nuevo("span", "", it);
        tx.textContent = txt;
        tx.style.whiteSpace = "nowrap";
        var ti = tamI;
        while (it.scrollWidth > 900 && ti > 44) { ti -= 4; it.style.fontSize = ti + "px"; }
        return { el: it, trazo: trazo };
      });
      return { el: g, cab: cw, filas: filas };
    }
    var izq = grupo(v.izq, false), der = grupo(v.der, true);
    var ti = b.entra + b.m.izq, td = b.entra + b.m.der;
    if (!z) {
      var altoC = izq.el.offsetHeight + 90 + der.el.offsetHeight;
      var arribaC = Math.max(290, 380 + (800 - altoC) / 2);
      izq.el.style.top = arribaC + "px";
      der.el.style.top = (arribaC + izq.el.offsetHeight + 90) + "px";
      Cinetica.subir(tl, izq.cab, ti, { stagger: 0.05 });
      izq.filas.forEach(function (f, k) { tl.fromTo(f.el, { x: -60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, ti + 0.25 + k * 0.1); });
      tl.to(izq.el, { scale: 0.9, opacity: 0.55, duration: 0.5, ease: "power3.inOut" }, td - 0.1);
      estado(der.el, { opacity: 0 });
      tl.fromTo(der.el, { opacity: 0, y: 140 }, { opacity: 1, y: 0, duration: 0.6, ease: "power4.out" }, td);
    } else {
      izq.el.style.top = (790 - izq.el.offsetHeight / 2) + "px";
      der.el.style.top = (790 - der.el.offsetHeight / 2) + "px";
      Cinetica.subir(tl, izq.cab, ti, { stagger: 0.05 });
      izq.filas.forEach(function (f, k) { tl.fromTo(f.el, { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, ti + 0.25 + k * 0.1); });
      tl.to(izq.el, { scale: 1.5, opacity: 0, filter: "blur(10px)", duration: 0.36, ease: "power2.in" }, td - 0.36);
      estado(der.el, { opacity: 0 });
      tl.fromTo(der.el, { opacity: 0, scale: 0.8, filter: "blur(8px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, td);
    }
    Cinetica.subir(tl, der.cab, td + 0.08, { stagger: 0.05 });
    der.filas.forEach(function (f, k) {
      var t = td + 0.3 + k * 0.14;
      tl.fromTo(f.el, { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, t);
      tl.fromTo(f.el.querySelector(".sello"), { scale: 0.4 }, { scale: 1, duration: 0.4, ease: "back.out(1.8)" }, t);
      tl.fromTo(f.trazo, { attr: { "stroke-dashoffset": 40 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.3, ease: "power2.out" }, t + 0.16);
    });
  }

  R.bloques.forEach(function (b, i) {
    var k = i + 1;
    var e = estacion(k);
    estaciones.push(e);
    var tipo = b.visual.tipo;
    if (tipo === "titulo") titulo(e, b);
    else if (tipo === "cuenta") (L === "zoom" ? cuentaTira : cuentaLibro)(e, b);
    else if (tipo === "comparacion") comparacion(e, b);
    // El paso de un bloque al siguiente: en la hoja la cámara viaja hacia abajo (el contenido sube);
    // en el zoom se empuja hacia adentro (lo que se va crece y pasa la cámara, lo que llega crece hasta su lugar).
    if (L === "hoja") {
      tl.to(riel, { y: -k * H, duration: 0.8, ease: "power3.inOut" }, b.entra);
      tl.to(profundo, { y: -k * H * 0.45, duration: 0.8, ease: "power3.inOut" }, b.entra);
      tl.to(cam, { scale: 1, duration: 0.8, ease: "power3.inOut" }, b.entra);
      tl.set(cam, { transformOrigin: "540px 960px" }, b.entra + 0.81);
    } else {
      var prev = estaciones[k - 1];
      tl.to(prev, { scale: 1.6, opacity: 0, filter: "blur(10px)", duration: 0.36, ease: "power2.in" }, b.entra);
      estado(e, { opacity: 0 });
      tl.fromTo(e, { scale: 0.82, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.55, ease: "power3.out" }, b.entra + 0.36);
      tl.to(hoja, { scale: Math.pow(1.16, k), duration: 0.9, ease: "power2.inOut" }, b.entra);
      tl.to(profundo, { scale: Math.pow(1.07, k), duration: 0.9, ease: "power2.inOut" }, b.entra);
      tl.to(cam, { scale: 1, duration: 0.6, ease: "power3.inOut" }, b.entra);
      tl.set(cam, { transformOrigin: "540px 960px" }, b.entra + 0.61);
    }
  });
  if (L === "zoom") estaciones.forEach(function (e) { e.style.transformOrigin = "540px 860px"; });
  hoja.style.transformOrigin = "2700px 2880px";

  Subtitulos.montar(tl, { contenedor: document.getElementById("subs"), grupos: R.grupos, tono: R.tono, resalte: R.resalte, tinta: R.tinta });
  tl.set({}, {}, R.duracion);
  window.__timelines["main"] = tl;
});
