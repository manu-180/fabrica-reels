<!doctype html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>cierre</title>
<script src="assets/vendor/gsap.min.js"></script>
<script src="assets/datos.js"></script>
<style>
{{css}}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--fondo); }
#root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--fondo); font-family: var(--f-cuerpo); color: var(--tinta); }
.capa { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; z-index: 3; }

.titular { position: absolute; left: 70px; width: 940px; text-align: center; font-family: var(--f-titulo); font-weight: var(--p-titulo); font-size: 92px; letter-spacing: calc(var(--tracking-titulo) * 1.5); line-height: 1; color: var(--tinta); text-wrap: balance; }
.destacado { display: flex; justify-content: center; align-items: baseline; font-family: var(--f-titulo); font-weight: var(--p-titulo); letter-spacing: calc(var(--tracking-titulo) * 1.66); line-height: 1; white-space: nowrap; }
.destacado span { display: inline-block; opacity: 0; white-space: pre; }
.destacado .cola { color: var(--tinta); }

/* El celular con la página real de la cuenta (una captura a 390 px de ancho en 2x). */
.cel { position: absolute; left: 196px; top: 648px; width: 688px; height: 1440px; border-radius: 96px; background: color-mix(in srgb, var(--fondo) 8%, black); padding: 16px; z-index: 3;
  box-shadow: 0 0 0 2px rgba(255,255,255,0.1), 0 70px 120px rgba(0,0,0,0.34), 0 20px 40px rgba(0,0,0,0.22); }
.pantalla { position: relative; width: 656px; height: 1408px; border-radius: 80px; overflow: hidden; background: color-mix(in srgb, var(--superficie) 70%, white); }
.pantalla img { position: absolute; left: 0; top: 0; width: 656px; height: auto; display: block; }
.pantalla .logo { position: absolute; left: 50%; top: 42%; width: 300px; height: 300px; margin: -150px 0 0 -150px; object-fit: contain; }
.marco { position: absolute; z-index: 4; overflow: visible; }
/* Sin captura: el logo de la cuenta como sello, sin un celular vacío. */
.sello { position: absolute; left: 340px; width: 400px; height: 400px; z-index: 3; border-radius: calc(var(--radio) * 2.4); overflow: hidden;
  box-shadow: 0 0 0 2px var(--linea-fuerte), 0 60px 110px var(--sombra-1), 0 16px 34px var(--sombra-2); background: var(--superficie); }
.sello img { display: block; width: 100%; height: 100%; object-fit: contain; }
.ficha { position: absolute; z-index: 4; padding: 18px 34px; border-radius: 999px; background: var(--acento); color: var(--sobre-acento); font-family: var(--f-titulo); font-weight: var(--p-titulo); font-size: 48px; letter-spacing: -0.02em; white-space: nowrap; }
#t-titular { top: 270px; }
#t-destacado { position: absolute; left: 40px; top: 378px; width: 1000px; font-size: 172px; color: var(--acento); }
#b-titular { top: 262px; }
#b-barra { position: absolute; left: 90px; top: 396px; width: 900px; height: 150px; border-radius: 75px; background: var(--superficie); z-index: 3;
  box-shadow: 0 0 0 2px var(--linea-fuerte), 0 26px 60px var(--sombra-2); }
#b-lupa { position: absolute; left: 26px; top: 26px; width: 98px; height: 98px; border-radius: 50%; background: var(--lupa); }
#b-lupa svg { position: absolute; left: 24px; top: 24px; width: 50px; height: 50px; overflow: visible; }
#b-pista { position: absolute; left: 154px; top: 46px; width: 590px; overflow: hidden; font-weight: 500; font-size: 42px; line-height: 56px; color: var(--tenue); white-space: nowrap; }
#b-destacado { position: absolute; left: 152px; top: 0; height: 150px; align-items: center; font-size: 84px; color: var(--acento); }
#b-ir { position: absolute; left: 770px; top: 23px; width: 104px; height: 104px; border-radius: 50%; background: var(--acento); opacity: 0.32; }
#b-ir svg { position: absolute; left: 24px; top: 24px; width: 56px; height: 56px; overflow: visible; }
#b-tilde { opacity: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="{{duracion}}">
  {{fondo}}

  <div id="camara" data-layout-allow-overflow>{{profundo}}<div id="riel" data-layout-allow-overflow>{{hoja}}</div></div>

  <div id="tipografico" class="capa">
    <h1 id="t-titular" class="titular">{{titular}}</h1>
    <div id="t-destacado" class="destacado"></div>
    <div id="t-ficha" class="ficha">{{ficha}}</div>
    <div id="t-cel" class="cel" data-layout-allow-overflow><div class="pantalla">{{pantalla_tipografico}}</div></div>
    <svg id="t-marco" class="marco" width="1080" height="1920" viewBox="0 0 1080 1920" style="left:0;top:0"><rect id="t-rect" x="0" y="0" width="10" height="10" rx="26" fill="none" stroke="var(--acento)" stroke-width="7"/></svg>
  </div>
  <!-- /tipografico -->

  <div id="buscador" class="capa">
    <h1 id="b-titular" class="titular">{{titular}}</h1>
    <div id="b-barra" data-layout-allow-overlap>
      <div id="b-lupa"><svg viewBox="0 0 52 52"><circle cx="22" cy="22" r="15" fill="none" stroke="var(--acento)" stroke-width="6"/><path d="M33.5 33.5 L46 46" fill="none" stroke="var(--acento)" stroke-width="6.5" stroke-linecap="round"/></svg></div>
      <span id="b-pista">{{pista}}</span>
      <div id="b-destacado" class="destacado"></div>
      <div id="b-ir">
        <svg viewBox="0 0 60 60"><path id="b-flecha" d="M12 30 H47 M31 14 L47 30 L31 46" fill="none" stroke="var(--sobre-acento)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path id="b-tilde" d="M12 31 L25 44 L49 17" fill="none" stroke="var(--sobre-acento)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>
    <div id="b-ficha" class="ficha">{{ficha}}</div>
    <div id="b-cel" class="cel" data-layout-allow-overflow><div class="pantalla">{{pantalla_buscador}}</div></div>
    <svg id="b-marco" class="marco" width="1080" height="1920" viewBox="0 0 1080 1920" style="left:0;top:0"><rect id="b-rect" x="0" y="0" width="10" height="10" rx="26" fill="none" stroke="var(--acento)" stroke-width="7"/></svg>
  </div>
  <!-- /buscador -->

  {{luces}}
  {{audio}}
</div>

<script>
(function () {
  const R = window.REEL;
  const T = R.tiempos;
  gsap.defaults({ lazy: false });
  const raiz = document.documentElement.style;
  for (const k in R.vars) raiz.setProperty("--" + k, R.vars[k]);
  const tl = gsap.timeline({ paused: true });

  // El destacado letra por letra; desde `corte` va en tinta para que se lea de un vistazo (".ar", ".com").
  function destacado(el, max) {
    const letras = Array.from(R.destacado).map(function (c, k) {
      const s = document.createElement("span");
      s.textContent = c;
      if (R.corte !== null && k >= R.corte) s.className = "cola";
      el.appendChild(s);
      return s;
    });
    let tam = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollWidth > max && tam > 60) { tam -= 4; el.style.fontSize = tam + "px"; }
    return letras;
  }

  function estado(el, v) { tl.fromTo(el, v, Object.assign({}, v, { duration: 0.001, ease: "none" }), 0); }
  function dibujar(path, t, dur) {
    const largo = path.getTotalLength();
    tl.fromTo(path, { strokeDasharray: largo, strokeDashoffset: largo }, { strokeDashoffset: 0, duration: dur, ease: "power2.out" }, t);
  }

  // La captura se corre hacia arriba lo justo para que la zona marcada quede arriba de y 1440 (zona segura).
  const C = R.captura;
  const ESC = C ? 656 / C.ancho : 1;
  const SUBE = C && C.marco ? Math.max(0, C.marco.y + C.marco.h - 920) : 0;
  function marco(rect, cel, t) {
    if (!C || !C.marco) return;
    const r = C.marco;
    const x = cel.offsetLeft + 16 + r.x * ESC - 16, y = cel.offsetTop + 16 + (r.y - SUBE) * ESC - 14;
    rect.setAttribute("x", x); rect.setAttribute("y", y); rect.setAttribute("width", r.w * ESC + 32); rect.setAttribute("height", r.h * ESC + 28);
    dibujar(rect, t, 0.55);
  }
  // El corte entra a mitad de movimiento: el celular ya viene subiendo en el cuadro 0.
  function celular(sel) { if (R.captura) tl.fromTo(sel, { y: 520 }, { y: 0, duration: 0.95, ease: "power3.out" }, 0); }
  function ficha(id) {
    const f = document.getElementById(id);
    if (!R.ficha) { f.style.display = "none"; return; }
    f.style.left = "90px"; f.style.top = "1150px";
    tl.fromTo(f, { opacity: 0, scale: 0.5, x: 60 }, { opacity: 1, scale: 1, x: 0, duration: 0.42, ease: "back.out(1.7)" }, T.ficha);
  }

  function tipografico() {
    const letras = destacado(document.getElementById("t-destacado"), 1000);
    tl.fromTo("#t-titular", { opacity: 0.45, y: 34, filter: "blur(5px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.34, ease: "expo.out" }, 0);
    const pag = document.getElementById("t-pagina");
    if (pag) pag.style.top = (-SUBE * ESC) + "px";
    celular("#t-cel");
    marco(document.getElementById("t-rect"), document.getElementById("t-cel"), T.marca);
    ficha("t-ficha");
    const corte = R.corte === null ? letras.length : R.corte;
    tl.fromTo(letras.slice(0, corte), { opacity: 0, y: 46, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power4.out", stagger: Math.min(0.05, (T.cola - T.destacado) / Math.max(1, corte)) }, T.destacado);
    if (corte < letras.length) tl.fromTo(letras.slice(corte), { opacity: 0, y: 46, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power4.out", stagger: 0.05 }, T.cola);
    tl.to("#t-destacado", { scale: 0.972, duration: 0.07, ease: "power2.out", transformOrigin: "50% 50%" }, T.golpe);
    tl.to("#t-destacado", { scale: 1, duration: 0.38, ease: "back.out(2)" }, T.golpe + 0.07);
  }

  function buscador() {
    const letras = destacado(document.getElementById("b-destacado"), 600);
    tl.fromTo("#b-titular", { opacity: 0.45, y: 34, filter: "blur(5px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.34, ease: "expo.out" }, 0);
    tl.fromTo("#b-barra", { opacity: 0.55, y: 96 }, { opacity: 1, y: 0, duration: 0.46, ease: "expo.out" }, 0);
    const res = document.getElementById("b-resultado");
    if (res) res.style.top = (-SUBE * ESC) + "px";
    celular("#b-cel");
    ficha("b-ficha");
    tl.to("#b-pista", { opacity: 0, duration: 0.08, ease: "none" }, T.destacado);
    const paso = (T.fin - 0.1 - T.destacado) / letras.length;
    letras.forEach(function (s, k) { tl.fromTo(s, { opacity: 0, y: 10, scale: 0.7 }, { opacity: 1, y: 0, scale: 1, duration: 0.16, ease: "back.out(2.2)", transformOrigin: "50% 80%" }, T.destacado + k * paso); });
    tl.fromTo("#b-ir", { opacity: 0.32, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.24, ease: "back.out(2)" }, T.destacado + 3 * paso);
    const envio = T.envio;
    tl.to("#b-ir", { scale: 0.84, duration: 0.07, ease: "power2.in" }, envio - 0.07);
    tl.to("#b-ir", { scale: 1, duration: 0.28, ease: "back.out(2)" }, envio);
    tl.to("#b-flecha", { opacity: 0, duration: 0.08, ease: "none" }, envio);
    tl.set("#b-tilde", { opacity: 1 }, envio + 0.04);
    dibujar(document.getElementById("b-tilde"), envio + 0.04, 0.26);
    // El enter carga la página: el resultado sube en el celular y se marca.
    if (res) {
      estado(res, { y: 1500 });
      tl.fromTo(res, { y: 1500 }, { y: 0, duration: 0.5, ease: "power3.out" }, envio + 0.04);
      marco(document.getElementById("b-rect"), document.getElementById("b-cel"), envio + 0.4);
    }
  }

  // Sin captura la composición se centra: titular, destacado, el sello con el logo y la ficha debajo.
  function sinCaptura(pre) {
    const capa = document.getElementById(pre === "t" ? "tipografico" : "buscador");
    document.getElementById(pre + "-cel").style.display = "none";
    const s = document.createElement("div");
    s.className = "sello";
    const img = document.createElement("img");
    img.src = R.logo;
    s.appendChild(img);
    capa.appendChild(s);
    const baja = pre === "t" ? 330 : 300;
    document.getElementById(pre + "-titular").style.top = (pre === "t" ? 270 : 262) + baja + "px";
    if (pre === "t") document.getElementById("t-destacado").style.top = 378 + baja + "px";
    else document.getElementById("b-barra").style.top = 396 + baja + "px";
    s.style.top = (pre === "t" ? 1020 : 1000) + "px";
    tl.fromTo(s, { y: 260, scale: 0.86, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.8, ease: "power3.out" }, 0);
    tl.to(s, { scale: 1.06, duration: 0.42, ease: "back.out(2.2)" }, T.golpe);
    tl.to(s, { scale: 1, duration: 0.5, ease: "power2.inOut" }, T.golpe + 0.42);
    return s;
  }

  function construir() {
    const pre = R.estilo === "tipografico" ? "t" : "b";
    if (!R.captura) sinCaptura(pre);
    if (R.estilo === "tipografico") tipografico(); else buscador();
    if (!R.captura && R.ficha) {
      const f = document.getElementById(pre + "-ficha");
      f.style.left = (540 - f.offsetWidth / 2) + "px";
      f.style.top = ((pre === "t" ? 1020 : 1000) + 440) + "px";
    }
    tl.set({}, {}, R.duracion);
    window.__timelines["main"] = tl;
  }

  Promise.all((R.fuentes || []).map(function (f) { return document.fonts.load(f); })).then(function () { return document.fonts.ready; }).then(construir, construir);
})();
</script>
</body>
</html>
